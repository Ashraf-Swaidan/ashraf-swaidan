<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="stickerLabBg" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4C8"/>
      <stop offset="0.45" stop-color="#FFD873"/>
      <stop offset="1" stop-color="#FFB24A"/>
    </linearGradient>
    <linearGradient id="stickerLabShine" x1="18" y1="8" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="stickerLabDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="64" height="64" rx="14" fill="url(#stickerLabBg)"/>
  <rect width="64" height="64" rx="14" fill="url(#stickerLabShine)"/>

  <!-- Back sticker (Ash-pack vibe: chunky outline, soft fill) -->
  <g filter="url(#stickerLabDrop)" transform="rotate(-10 32 34)">
    <rect
      x="11"
      y="22"
      width="30"
      height="30"
      rx="8.5"
      fill="#FFFDF7"
      stroke="#1E1E1E"
      stroke-width="2.25"
    />
    <path
      d="M28 30h8M28 35h12M28 40h6"
      stroke="#1E1E1E"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.35"
    />
  </g>

  <!-- Front sticker -->
  <g filter="url(#stickerLabDrop)" transform="rotate(8 34 28)">
    <rect
      x="24"
      y="14"
      width="30"
      height="30"
      rx="8.5"
      fill="#FFFFFF"
      stroke="#1E1E1E"
      stroke-width="2.25"
    />
    <!-- Peel corner -->
    <path
      d="M48 14 L54 14 L48 20 Z"
      fill="#F0EDE6"
      stroke="#1E1E1E"
      stroke-width="1.75"
      stroke-linejoin="round"
    />
    <!-- Simple reaction face (reads at dock size) -->
    <circle cx="34" cy="26.5" r="1.65" fill="#1E1E1E"/>
    <circle cx="44" cy="26.5" r="1.65" fill="#1E1E1E"/>
    <path
      d="M33.5 33.5c2.2 2.8 6.8 2.8 9 0"
      stroke="#1E1E1E"
      stroke-width="2"
      stroke-linecap="round"
    />
    <!-- Accent spark -->
    <path
      d="M31 36.5l0.9 2 2.1 0.3-1.5 1.5 0.35 2.05-1.85-1-1.85 1 0.35-2.05-1.5-1.5 2.1-0.3 0.9-2Z"
      fill="#FFCC33"
      stroke="#1E1E1E"
      stroke-width="1.1"
      stroke-linejoin="round"
    />
  </g>
</svg>
