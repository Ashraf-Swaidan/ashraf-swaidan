
<style>
  .container { padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 2rem; }
  .label { font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-text-primary); letter-spacing: -0.02em; min-height: 28px; text-align: center; transition: opacity 0.4s; }
  .sublabel { font-family: var(--font-sans); font-size: 13px; color: var(--color-text-secondary); text-align: center; }
  .btn { font-family: var(--font-sans); font-size: 14px; padding: 8px 24px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-primary); cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: var(--color-background-secondary); }
  .btn:disabled { opacity: 0.3; cursor: default; }
</style>

<div class="container">
  <div class="label" id="label">I identify problems</div>
  <svg width="100%" viewBox="0 0 600 120" id="linesvg" style="overflow:visible;">
    <path id="linepath" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="sublabel" id="sublabel">rough edges, unresolved tension</div>
  <button class="btn" id="btn" onclick="nextStep()">watch me solve it →</button>
</div>

<script>
const steps = [
  {
    label: "I identify problems",
    sublabel: "rough edges, unresolved tension",
    d: "M20,60 C40,20 55,95 75,35 C95,-5 110,90 130,50 C150,15 165,85 185,30 C205,-10 220,95 240,55 C260,10 275,90 295,40 C315,5 330,85 350,45 C370,10 385,90 405,35 C425,-5 440,90 460,50 C480,15 495,85 515,30 C535,-5 550,90 580,60",
    color: "#E24B4A",
    btnText: "ease it →",
    btnNext: 1
  },
  {
    label: "I ease them",
    sublabel: "reducing friction, finding a cleaner path",
    d: "M20,60 C60,35 100,75 140,50 C180,28 220,70 260,55 C300,38 340,68 380,52 C420,36 460,70 500,55 C530,44 560,62 580,60",
    color: "#EF9F27",
    btnText: "solve it →",
    btnNext: 2
  },
  {
    label: "I solve them",
    sublabel: "8 steps become 2. chaos becomes an orchestra.",
    d: "M20,60 L580,60",
    color: "#1D9E75",
    btnText: "reset",
    btnNext: 0
  }
];

let current = 0;
let animating = false;

const path = document.getElementById('linepath');
const label = document.getElementById('label');
const sublabel = document.getElementById('sublabel');
const btn = document.getElementById('btn');

function lerp(a, b, t) { return a + (t - a) * t; }

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function interpolateColor(c1, c2, t) {
  const [r1,g1,b1] = hexToRgb(c1);
  const [r2,g2,b2] = hexToRgb(c2);
  const r = Math.round(r1 + (r2-r1)*t);
  const g = Math.round(g1 + (g2-g1)*t);
  const b = Math.round(b1 + (b2-b1)*t);
  return `rgb(${r},${g},${b})`;
}

function parsePath(d) {
  const points = [];
  const parts = d.trim().split(/(?=[MmCcLl])/);
  for (const part of parts) {
    const nums = part.slice(1).trim().split(/[\s,]+/).map(Number).filter(n => !isNaN(n));
    const cmd = part[0];
    if (cmd === 'M' || cmd === 'L') {
      for (let i = 0; i < nums.length; i+=2) points.push({x: nums[i], y: nums[i+1]});
    } else if (cmd === 'C') {
      for (let i = 0; i < nums.length; i+=6) {
        points.push({x: nums[i], y: nums[i+1]});
        points.push({x: nums[i+2], y: nums[i+3]});
        points.push({x: nums[i+4], y: nums[i+5]});
      }
    }
  }
  return points;
}

function buildPath(points, cmd) {
  if (cmd === 'L' || points.length <= 2) {
    return 'M' + points.map(p => `${p.x},${p.y}`).join(' L');
  }
  let d = `M${points[0].x},${points[0].y}`;
  for (let i = 1; i < points.length; i+=3) {
    if (i+2 < points.length) {
      d += ` C${points[i].x},${points[i].y} ${points[i+1].x},${points[i+1].y} ${points[i+2].x},${points[i+2].y}`;
    }
  }
  return d;
}

function interpolatePoints(p1, p2, t) {
  const len = Math.max(p1.length, p2.length);
  const result = [];
  for (let i = 0; i < len; i++) {
    const a = p1[Math.min(i, p1.length-1)];
    const b = p2[Math.min(i, p2.length-1)];
    result.push({ x: a.x + (b.x - a.x)*t, y: a.y + (b.y - a.y)*t });
  }
  return result;
}

function render(step) {
  const s = steps[step];
  path.setAttribute('d', s.d);
  path.setAttribute('stroke', s.color);
  label.textContent = s.label;
  sublabel.textContent = s.sublabel;
  btn.textContent = s.btnText;
}

function nextStep() {
  if (animating) return;
  const from = steps[current];
  const to = steps[from.btnNext];
  animating = true;
  btn.disabled = true;

  const fromPts = parsePath(from.d);
  const toPts = parsePath(to.d);
  const maxPts = Math.max(fromPts.length, toPts.length);

  function padPoints(pts, n) {
    while (pts.length < n) pts.push({...pts[pts.length-1]});
    return pts;
  }

  const p1 = padPoints([...fromPts], maxPts);
  const p2 = padPoints([...toPts], maxPts);

  const duration = 900;
  const start = performance.now();

  function tick(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    const pts = interpolatePoints(p1, p2, ease);
    const color = interpolateColor(from.color, to.color, ease);
    path.setAttribute('d', buildPath(pts, 'C'));
    path.setAttribute('stroke', color);
    if (t < 1) {
      requestAnimationFrame(tick);
    } else {
      current = from.btnNext;
      label.textContent = to.label;
      sublabel.textContent = to.sublabel;
      btn.textContent = to.btnText;
      animating = false;
      btn.disabled = false;
    }
  }

  requestAnimationFrame(tick);
}

render(0);
</script>
