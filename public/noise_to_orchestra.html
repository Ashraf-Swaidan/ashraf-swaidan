
<style>
  .wrap { padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
  .label { font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-text-primary); letter-spacing: -0.02em; min-height: 28px; text-align: center; }
  .sublabel { font-family: var(--font-sans); font-size: 13px; color: var(--color-text-secondary); text-align: center; min-height: 20px; }
  .btn { font-family: var(--font-sans); font-size: 14px; padding: 8px 24px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-primary); cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: var(--color-background-secondary); }
  .btn:disabled { opacity: 0.3; cursor: default; }
</style>

<div class="wrap">
  <div class="label" id="label">mentally exhausting workflows</div>
  <canvas id="c" width="560" height="160" style="width:100%;max-width:560px;"></canvas>
  <div class="sublabel" id="sublabel">erratic, unsynced, draining</div>
  <button class="btn" id="btn" onclick="conduct()">conduct it →</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const COLS = 14, ROWS = 5;
const PAD_X = 30, PAD_Y = 20;
const W = 560, H = 160;
const CELL_W = (W - PAD_X*2) / (COLS-1);
const CELL_H = (H - PAD_Y*2) / (ROWS-1);

let phase = 0; // 0=chaos, 1=transitioning, 2=orchestra
let progress = 0;
let raf;

const dots = [];
for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    dots.push({
      x: PAD_X + c * CELL_W,
      y: PAD_Y + r * CELL_H,
      offset: Math.random() * Math.PI * 2,
      speed: 0.04 + Math.random() * 0.12,
      baseSize: 2.5 + Math.random() * 3,
      targetOffset: 0,
      targetSpeed: 0.045
    });
  }
}

function lerpVal(a, b, t) { return a + (b - a) * t; }

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function interpolateColor(c1, c2, t) {
  const [r1,g1,b1] = hexToRgb(c1);
  const [r2,g2,b2] = hexToRgb(c2);
  return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
}

let time = 0;

function draw() {
  ctx.clearRect(0, 0, W, H);
  time += 1;

  const t = progress;
  const eased = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;

  dots.forEach((d, i) => {
    const row = Math.floor(i / COLS);
    const col = i % COLS;

    let spd, off, size;

    if (phase === 0) {
      spd = d.speed;
      off = d.offset;
      size = d.baseSize;
    } else if (phase === 1) {
      const syncOff = (row * 0.4);
      spd = lerpVal(d.speed, d.targetSpeed, eased);
      off = lerpVal(d.offset, syncOff, eased);
      size = lerpVal(d.baseSize, 3.5, eased);
    } else {
      spd = d.targetSpeed;
      off = (row * 0.4);
      size = 3.5;
    }

    const pulse = Math.sin(time * spd + off);
    const radius = size + pulse * size * 0.7;
    const alpha = phase === 0
      ? 0.3 + Math.abs(pulse) * 0.7
      : lerpVal(0.3 + Math.abs(pulse) * 0.7, 0.4 + (pulse+1)/2 * 0.6, eased);

    const color = phase === 0
      ? interpolateColor('#E24B4A', '#888780', (pulse+1)/2)
      : interpolateColor('#E24B4A', '#1D9E75', eased);

    ctx.beginPath();
    ctx.arc(d.x, d.y, Math.max(0.5, radius), 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  if (phase === 1) {
    progress = Math.min(progress + 0.008, 1);
    if (progress >= 1) {
      phase = 2;
      playChord();
      document.getElementById('label').textContent = 'an orchestra';
      document.getElementById('sublabel').textContent = 'every part moving, all in sync';
      document.getElementById('btn').textContent = 'reset';
      document.getElementById('btn').disabled = false;
    }
  }

  raf = requestAnimationFrame(draw);
}

function playChord() {
  try {
    const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
    const freqs = [261.6, 329.6, 392.0, 523.3];
    freqs.forEach((freq, i) => {
      const osc = ctx2.createOscillator();
      const gain = ctx2.createGain();
      osc.connect(gain);
      gain.connect(ctx2.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx2.currentTime + i*0.08);
      gain.gain.linearRampToValueAtTime(0.12, ctx2.currentTime + i*0.08 + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + i*0.08 + 2.2);
      osc.start(ctx2.currentTime + i*0.08);
      osc.stop(ctx2.currentTime + i*0.08 + 2.5);
    });
  } catch(e) {}
}

function conduct() {
  if (phase === 0) {
    phase = 1;
    progress = 0;
    document.getElementById('btn').disabled = true;
    document.getElementById('label').textContent = 'into an orchestra';
    document.getElementById('sublabel').textContent = 'finding the beat...';
  } else if (phase === 2) {
    phase = 0;
    progress = 0;
    dots.forEach(d => {
      d.offset = Math.random() * Math.PI * 2;
      d.speed = 0.04 + Math.random() * 0.12;
      d.baseSize = 2.5 + Math.random() * 3;
    });
    document.getElementById('label').textContent = 'mentally exhausting workflows';
    document.getElementById('sublabel').textContent = 'erratic, unsynced, draining';
    document.getElementById('btn').textContent = 'conduct it →';
  }
}

draw();
</script>
